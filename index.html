<!DOCTYPE html>
<html>
  <head>
    <title>Sight Marks</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="container">
      <div id="input">
        <div class="centered">
          <table id="sight settings">
            <tbody id="sight_settings">
              <tr>
                <td>Sight TPI</td>
                <td><input type="number" id="sight_tpi" size="3" required /></td>
              </tr>
              <tr>
                <td>Sight Scale</td>
                <td>
                  <select id="sight_scale">
                    <option value="10">0-10</option>
                    <option value="1">0-100</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td>Nock to Sight (mm)</td>
                <td><input type="number" id="nock_to_pin" size="5" required /></td>
              </tr>
              <tr>
                <td>Nock to Eye (mm)</td>
                <td><input type="number" id="nock_to_eye" size="5" required /></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="centered">
          <table id="measured">
            <thead>
              <tr>
                <th>Distance</th>
                <th>Mark</th>
              </tr>
            </thead>
            <tbody id="input_marks">
              <tr>
                <td><input type="number" name="dist" size="4" /></td>
                <td><input type="number" name="mark" size="5" /></td>
                <td>
                  <select>
                    <option value="m">Meter</option>
                    <option value="yd">Yard</option>
                    <option value="ft">Feet</option>
                  </select>
                </td>
                <td><input type="button" name="add" onclick="addMark(this);" value="Add Mark" /></td>
                <td><input type="button" name="remove" onclick="removeMark(this);" value="Remove Mark" /></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="centered">
          <select id="calc_unit" class="big">
            <option value="m">Meter</option>
            <option value="yd">Yard</option>
            <option value="ft">Feet</option>
          </select>
          <button id="calculate" class="big">Calculate</button>
        </div>
        <script>
          function addMark(n) {
            var tr = n.parentNode.parentNode.cloneNode(true);
            document.getElementById('input_marks').appendChild(tr);
          }

          function removeMark(n) {
            var table = document.getElementById('input_marks');
            if (table.rows.length > 1) {
              n.closest('tr').remove();
            }
          }
        </script>
      </div>
      <div id="results">
        <h1>Calculated</h1>
        <div id="trajectory" class="centered">
          <table id="vals">
              <tr>
                <td>Velocity:</td>
                <td id="velocity"></td>
              </tr>
              <tr>
                <td>Drag:</td>
                <td id="drag"></td>
              </tr>
              <tr>
                <td>Fit Score (closer to 0 is better):</td>
                <td id="fit_score"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div id="trajectory_canvas_container" class="centered">
          <canvas id="trajectory_canvas"></canvas>
        </div>
        <div id="graph"></div>
        <div id="calculated">
          <div class="centered">
          <h1>Marks</h1>
          </div>
          <div class="centered">
            <table id="calc_m">
              <thead>
                <tr>
                  <th>Distance</th>
                  <th>Mark</th>
                </tr>
              </thead>
              <tbody id="marks"></tbody>
            </table>
          </div>
       </div>
      </div>
    </div>
    <script src="src/trajectory.js"></script>
  </body>
</html>
